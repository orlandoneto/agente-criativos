<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #F8FAFC;
    }
    .slide {
      position: relative;
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      background: {{ fundo }};
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        {% if cena_data_uri %}
        url("{{ cena_data_uri }}") center/cover no-repeat,
        {% endif %}
        radial-gradient(ellipse at 30% 10%, {{ destaque }}44 0%, transparent 50%),
        {{ fundo }};
    }
    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.35) 0%,
        rgba(0,0,0,0.15) 38%,
        rgba(0,0,0,0.55) 62%,
        rgba(0,0,0,0.88) 100%
      );
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 56px 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .badge {
      background: {{ destaque }};
      color: #0B1220;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 14px 22px;
      border-radius: 8px;
    }
    .page {
      font-size: 28px;
      font-weight: 600;
      opacity: 0.9;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .bottom { max-width: 95%; }
    .brand {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: {{ destaque }};
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
    }
    .titulo {
      font-size: {{ titulo_size }}px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-shadow: 0 3px 16px rgba(0,0,0,0.65);
      word-wrap: break-word;
    }
    .apoio {
      margin-top: 22px;
      font-size: 34px;
      line-height: 1.35;
      font-weight: 500;
      opacity: 0.95;
      max-width: 92%;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
      word-wrap: break-word;
    }
    .bar {
      width: 110px;
      height: 8px;
      border-radius: 999px;
      background: {{ destaque }};
      margin: 28px 0 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg"></div>
    <div class="veil"></div>
    <div class="content">
      <div class="top">
        <div class="badge">{{ selo }}</div>
        <div class="page">{{ indice }}/{{ total }}</div>
      </div>
      <div class="bottom">
        <div class="brand">{{ nome }}</div>
        <div class="titulo">{{ titulo }}</div>
        {% if apoio %}
        <div class="apoio">{{ apoio }}</div>
        {% endif %}
        <div class="bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
