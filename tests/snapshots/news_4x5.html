<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>


@font-face{…}
@font-face{…}
@font-face{…}
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --w: 1080px; --h: 1350px;
  --hl: #FFD60A;
  --tag: #E10600;
  --pad: 64px;
}
html, body { width: var(--w); height: var(--h); overflow: hidden; background: #000; }
body { font-family: 'Montserrat', 'Montserrat', 'Segoe UI', sans-serif; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
.card { position: relative; width: var(--w); height: var(--h); overflow: hidden;
  background: radial-gradient(ellipse at 30% 20%, #2a2a33 0%, #0B0B0F 55%, #000 100%); }
.foto { position: absolute; inset: 0; background-size: cover; background-position: center;
  
   }
.grad { position: absolute; inset: 0; background:
  linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 38%,
  rgba(0,0,0,.72) 60%, rgba(0,0,0,.94) 82%, #000 100%); }
.escurecer .grad { background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.3) 22%, rgba(0,0,0,.45) 38%,
  rgba(0,0,0,.86) 56%, rgba(0,0,0,.97) 78%, #000 100%); }
.topo { position: absolute; top: var(--pad); left: var(--pad); right: var(--pad);
  display: flex; align-items: center; justify-content: space-between; }
.tag { display: inline-flex; align-items: center; gap: 14px; background: var(--tag);
  font-family: 'Bebas Neue', 'Anton', sans-serif; font-size: 50px;
  letter-spacing: .06em; line-height: 1; padding: 14px 26px 10px; text-transform: uppercase;
  box-shadow: 0 8px 24px rgba(225,6,0,.35); }
.tag .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateY(-2px); }
.logo { height: 72px; max-width: 260px; object-fit: contain; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
.marca { font-weight: 800; font-size: 26px; letter-spacing: .14em; text-transform: uppercase;
  opacity: .9; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.base { position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad); }
.titulo { font-family: 'Anton', 'Anton', 'Bebas Neue', Impact, sans-serif; text-transform: uppercase;
  font-size: 150px; line-height: 1.05; letter-spacing: .005em;
  max-height: 600px; overflow: hidden;
  overflow-wrap: normal; word-break: keep-all; text-shadow: 0 4px 22px rgba(0,0,0,.55); }
.titulo .hl { color: var(--hl); }
.apoio { margin-top: 22px; font-weight: 600; font-size: 32px;
  line-height: 1.32; color: #E8E8E8; max-width: 94%;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rodape { margin-top: 30px; display: flex; align-items: center; gap: 18px; }
.rodape .barra { width: 72px; height: 8px; background: var(--tag); border-radius: 2px; }
.rodape .handle { font-weight: 800; font-size: 30px; letter-spacing: .02em; }
.arraste { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px;
  letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
.arraste svg { width: 30px; height: 30px; }
.credito { position: absolute; right: 18px; top: 50%; transform: translateY(-50%) rotate(180deg);
  writing-mode: vertical-rl; font-size: 16px; font-weight: 500; opacity: .6; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card" data-estilo="news" data-formato="4x5">
  <div class="foto"></div>
  <div class="grad"></div>
  <div class="topo">
    <div class="tag"><span class="dot"></span>Urgente</div>
    
  </div>
  <div class="base">
    <h1 class="titulo" id="titulo"><span class="hl">Calor extremo</span> atinge <span class="hl">40 graus</span> no Nordeste</h1>
    <p class="apoio">Defesa Civil emite alerta laranja</p>
    <div class="rodape"><span class="barra"></span><span class="handle">@minhamarca</span></div>
  </div>
  
</div>
<script>
function fit(el, min) {
  const cs = getComputedStyle(el);
  const maxH = parseFloat(cs.maxHeight);
  el.style.maxHeight = 'none';
  el.style.overflow = 'visible';
  let s = parseFloat(cs.fontSize);
  while ((el.offsetHeight > maxH || el.scrollWidth > el.clientWidth + 1) && s > min) {
    s -= 2; el.style.fontSize = s + 'px';
  }
  el.dataset.fit = String(s);
  el.dataset.maxh = String(maxH);
}
document.fonts.ready.then(() => { fit(document.getElementById('titulo'), 54); document.body.dataset.ready = '1'; });
</script>
</body>
</html>
